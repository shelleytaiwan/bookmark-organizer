<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書籤整理器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .drag-over-category { background-color: #e0e7ff !important; border: 2px dashed #4f46e5 !important; }
        .app-h { height: 100vh; height: 100dvh; }
        #sidebar { transition: transform .2s ease; }
        #sidebar.drawer-open { transform: translateX(0); }
        .drag-hint { display: none; }
        @media (hover: hover) { .drag-hint { display: inline; } }
        /* 觸控裝置（手機 / iPad）沒有「滑過」，所以編輯、刪除按鈕要一直顯示，並放大好按 */
        @media (hover: none) {
            [class*="group-hover"] { opacity: 1 !important; }
            #categoryTree [class*="group-hover"] button { padding: 6px 7px; font-size: 13px !important; }
            .card-del { padding: 8px !important; font-size: 14px !important; }
        }
        /* 手機上輸入框字體 < 16px 時 iOS 會自動放大畫面，所以小螢幕一律 16px */
        @media (max-width: 767px) { input, textarea, select { font-size: 16px !important; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 app-h flex flex-col font-sans overflow-hidden">

    <!-- 頂部導覽列 -->
    <header class="bg-white border-b border-slate-200 flex-shrink-0 z-30 shadow-sm">
        <div class="max-w-[1600px] mx-auto px-3 sm:px-4 py-2.5 sm:py-3 flex items-center justify-between gap-2 sm:gap-4">
            <div class="flex items-center gap-2 sm:gap-3 min-w-0">
                <button onclick="toggleDrawer()" class="lg:hidden p-2 -ml-1 text-slate-600 hover:bg-slate-100 rounded-lg" aria-label="開啟分類選單" title="分類選單">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="bg-indigo-600 text-white p-2 sm:p-2.5 rounded-xl shadow-md flex-shrink-0">
                    <i class="fa-solid fa-bookmark text-lg sm:text-xl"></i>
                </div>
                <h1 class="hidden sm:block text-xl font-bold text-slate-800 tracking-tight truncate">書籤整理器</h1>
            </div>

            <!-- 右側操作區 -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <span id="saveStatus" class="text-xs text-slate-400 mr-0.5 sm:mr-1 whitespace-nowrap" title="資料會自動儲存在這個瀏覽器裡"></span>
                <button onclick="syncNow()" class="px-2.5 sm:px-3.5 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-sm font-medium rounded-lg transition flex items-center gap-2 border border-emerald-200" aria-label="同步最新版" title="從網站讀取最新的 bookmarks.json">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    <span class="hidden md:inline">同步最新</span>
                </button>
                <button onclick="openImportModal()" class="px-2.5 sm:px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition flex items-center gap-2" aria-label="匯入或貼上 JSON" title="匯入 / 貼上 JSON">
                    <i class="fa-solid fa-file-import text-indigo-600"></i>
                    <span class="hidden md:inline">匯入 / 貼上 JSON</span>
                </button>
                <button onclick="exportJSON()" class="px-2.5 sm:px-3.5 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-sm font-medium rounded-lg transition flex items-center gap-2 border border-indigo-200" aria-label="匯出 JSON 備份" title="匯出 JSON 備份">
                    <i class="fa-solid fa-file-export"></i>
                    <span class="hidden md:inline">匯出 JSON 備份</span>
                </button>
                <button onclick="exportHTML()" class="px-2.5 sm:px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium rounded-lg transition flex items-center gap-2 shadow-sm" aria-label="匯出 HTML 書籤" title="匯出 HTML 書籤">
                    <i class="fa-solid fa-download"></i>
                    <span class="hidden md:inline">匯出 HTML 書籤</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <div class="flex-1 min-h-0 max-w-[1600px] w-full mx-auto flex overflow-hidden">
        
        <!-- 左側邊欄：分類樹狀管理 -->
        <div id="drawerBackdrop" onclick="closeDrawer()" class="fixed inset-0 bg-slate-900/40 z-30 hidden lg:hidden"></div>
        <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-80 max-w-[85vw] -translate-x-full lg:translate-x-0 border-r border-slate-200 bg-white flex flex-col flex-shrink-0 h-full overflow-hidden shadow-xl lg:shadow-none">
            <div class="p-3 border-b border-slate-100 flex items-center justify-between bg-slate-50 flex-shrink-0">
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">分類樹狀管理</span>
                <div class="flex items-center gap-2">
                    <button onclick="addMainCategory()" class="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-2 py-1 rounded font-medium transition flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> 新增主分類
                    </button>
                    <button onclick="closeDrawer()" class="lg:hidden text-slate-400 hover:text-slate-600 p-1.5" aria-label="關閉分類選單">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
            </div>

            <div class="p-2 border-b border-slate-100 flex-shrink-0">
                <button onclick="selectCategory('ALL')" id="cat-btn-ALL" class="w-full text-left px-3 py-2.5 rounded-xl font-medium text-sm flex items-center justify-between transition bg-indigo-600 text-white shadow-sm">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-layer-group"></i>
                        <span>全部網址書籤</span>
                    </div>
                    <span id="count-ALL" class="bg-white/20 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
            </div>

            <!-- 分類清單樹狀區 -->
            <div id="categoryTree" class="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar">
                <!-- 動態渲染 -->
            </div>

            <!-- 底欄統計與重置 -->
            <div class="p-3 border-t border-slate-200 bg-slate-50 text-xs text-slate-500 flex items-center justify-between flex-shrink-0">
                <div>
                    <div>總書籤數: <span id="stat-total" class="font-bold text-slate-700">0</span></div>
                    <div>總分類數: <span id="stat-cats" class="font-bold text-slate-700">0</span></div>
                </div>
                <button onclick="resetToDefaultTaxonomy()" class="text-slate-400 hover:text-rose-600 transition" title="還原預設分類架構">
                    <i class="fa-solid fa-rotate-left"></i> 重置分類
                </button>
            </div>
        </aside>

        <!-- 右側內容區：網址與清單 -->
        <main class="flex-1 min-w-0 min-h-0 flex flex-col bg-slate-50 h-full overflow-hidden">
            <!-- 頂部篩選與搜尋欄 -->
            <div class="p-3 sm:p-4 bg-white border-b border-slate-200 flex flex-wrap items-center justify-between gap-3 sm:gap-4 shadow-sm flex-shrink-0">
                <div class="flex items-center gap-3 flex-1 min-w-[200px]">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" id="searchInput" oninput="renderBookmarks()" placeholder="搜尋網址標題、URL 或標籤..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span id="currentCategoryTitle" class="text-sm font-bold text-slate-700 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 truncate max-w-[55vw] sm:max-w-xs">
                        全部網址書籤
                    </span>
                    <button onclick="openAddBookmarkModal()" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition shadow-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-plus"></i>
                        <span>新增網址</span>
                    </button>
                </div>
            </div>

            <!-- 書籤卡片顯示區 -->
            <div id="bookmarkContainer" class="flex-1 overflow-y-auto p-3 sm:p-4 custom-scrollbar">
                <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3" id="bookmarkGrid">
                    <!-- 動態渲染網址卡片 -->
                </div>
            </div>
        </main>
    </div>

    <!-- 匯入 / 貼上 JSON 彈出視窗 -->
    <div id="importModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-xl w-full p-4 sm:p-6 mx-3 sm:mx-4 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-file-import text-indigo-600"></i>
                    <span>匯入資料與書籤</span>
                </h3>
                <button onclick="closeImportModal()" class="text-slate-400 hover:text-slate-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-4">
                <!-- 方式 1: 貼上 JSON 或網址文字 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">方式 A：貼上 JSON 備份碼 或 網址清單</label>
                    <textarea id="importTextarea" rows="5" placeholder='請在此貼上 JSON 備份文字內容，或是多筆網址列...' class="w-full p-3 border border-slate-300 rounded-xl text-xs font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    <button onclick="processPastedText()" class="mt-2 w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg transition">
                        解析並載入內容
                    </button>
                </div>

                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink mx-3 text-xs text-slate-400 font-medium">或</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>

                <!-- 方式 2: 上傳 JSON 或 HTML 檔案 -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">方式 B：選擇或拖放檔案 (.JSON / .HTML)</label>
                    <div onclick="document.getElementById('fileInput').click()" class="border-2 border-dashed border-slate-300 hover:border-indigo-500 rounded-xl p-6 text-center cursor-pointer transition bg-slate-50 hover:bg-indigo-50/30">
                        <i class="fa-solid fa-cloud-arrow-up text-2xl text-indigo-500 mb-2"></i>
                        <p class="text-xs font-medium text-slate-600">點擊上傳或拖放 JSON / HTML 檔案至此</p>
                        <p class="text-[10px] text-slate-400 mt-1">支援 JSON 備份檔與 Chrome/Firefox HTML 書籤檔</p>
                    </div>
                    <input type="file" id="fileInput" accept=".json,.html,.htm" class="hidden" onchange="handleFileSelect(event)">
                </div>
            </div>
        </div>
    </div>

        ];

        let state = {
            taxonomy: [],
            bookmarks: [],
            activeCategory: 'ALL'
        };

        // ===== 自動記憶：同時存在 localStorage 與 IndexedDB（雙備份） =====
        const LS_KEYS = { taxonomy: 'bm_taxonomy', bookmarks: 'bm_bookmarks', time: 'bm_saved_at' };
        const IDB_NAME = 'bookmark-organizer-db';
        const IDB_STORE = 'kv';

        function idbOpen() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) return reject(new Error('no indexedDB'));
                const req = indexedDB.open(IDB_NAME, 1);
                req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }
        async function idbGet(key) {
            const db = await idbOpen();
            return new Promise((resolve, reject) => {
                const r = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
                r.onsuccess = () => resolve(r.result);
                r.onerror = () => reject(r.error);
            });
        }
        async function idbSet(key, value) {
            const db = await idbOpen();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readwrite');
                tx.objectStore(IDB_STORE).put(value, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error);
            });
        }

        function readFromLocalStorage() {
            try {
                const t = localStorage.getItem(LS_KEYS.taxonomy);
                const b = localStorage.getItem(LS_KEYS.bookmarks);
                if (t === null && b === null) return null;
                return {
                    taxonomy: t ? JSON.parse(t) : null,
                    bookmarks: b ? JSON.parse(b) : null,
                    savedAt: Number(localStorage.getItem(LS_KEYS.time)) || 0,
                    seedVersion: localStorage.getItem('bm_seed_version') || ''
                };
            } catch (e) { return null; }
        }

        async function readFromIndexedDB() {
            try {
                const d = await idbGet('state');
                return d || null;
            } catch (e) { return null; }
        }

        function showSaveStatus(ok, detail) {
            const el = document.getElementById('saveStatus');
            if (!el) return;
            if (ok) {
                const t = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
                el.className = 'text-xs text-emerald-600 mr-1 whitespace-nowrap';
                el.innerHTML = '<i class="fa-solid fa-circle-check"></i><span class="hidden md:inline"> 已自動儲存 ' + t + '</span>';
            } else {
                el.className = 'text-xs text-rose-600 font-bold mr-1 whitespace-nowrap';
                el.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> <span class="md:hidden">無法記憶</span><span class="hidden md:inline">此環境無法記憶，請記得匯出 JSON</span>';
                el.title = detail || '';
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await loadState();
            renderAll();
            checkRemoteUpdate(); // 背景檢查網站上有沒有新版 bookmarks.json
            // 要求瀏覽器「持久保存」，避免空間不足時被自動清除
            try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
        });

        let freshSeed = false;      // 這次是不是第一次使用（從內建資料開始，使用者還沒改過）
        let ackVersion = '';        // 已經處理過（換成或選擇保留）的網站版本

        async function loadState() {
            const fromLS = readFromLocalStorage();
            const fromIDB = await readFromIndexedDB();

            // 兩邊都有時，採用較新的那一份
            let saved = null;
            if (fromLS && fromIDB) saved = (fromIDB.savedAt || 0) > (fromLS.savedAt || 0) ? fromIDB : fromLS;
            else saved = fromLS || fromIDB;

            const validTax = saved && Array.isArray(saved.taxonomy) && saved.taxonomy.length > 0;
            const validBm = saved && Array.isArray(saved.bookmarks);

            state.taxonomy = validTax ? saved.taxonomy : JSON.parse(JSON.stringify(DEFAULT_TAXONOMY));

            if (validBm) {
                // 有存檔就照存檔（包含你刻意刪光的情況）
                state.bookmarks = saved.bookmarks;
                ackVersion = saved.seedVersion || '';
                seedVersionInUse = ackVersion;
            } else {
                // 從來沒存過：載入內建預設書籤，並立刻存起來
                state.bookmarks = JSON.parse(JSON.stringify(DEFAULT_BOOKMARKS));
                freshSeed = true;
                persistState();
            }
            showSaveStatus(!!saved || localStorageWorks());
        }

        // ===== 從網站讀取最新的 bookmarks.json（和這個網頁放在同一個資料夾） =====
        function dataHash(tax, bms) {
            const str = JSON.stringify({ t: tax, b: bms });
            let h = 5381;
            for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
            return (h >>> 0).toString(36) + '-' + str.length;
        }

        async function fetchRemote() {
            if (location.protocol === 'file:') return null;
            try {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 8000);
                const res = await fetch('bookmarks.json?t=' + Date.now(), { cache: 'no-store', signal: ctrl.signal });
                clearTimeout(timer);
                if (!res.ok) return null;
                const d = await res.json();
                if (!d || !Array.isArray(d.taxonomy) || d.taxonomy.length === 0 || !Array.isArray(d.bookmarks)) return null;
                return { taxonomy: d.taxonomy, bookmarks: d.bookmarks };
            } catch (e) { return null; }
        }

        function applyRemote(remote, ver) {
            state.taxonomy = remote.taxonomy;
            state.bookmarks = remote.bookmarks;
            seedVersionInUse = ver;
            ackVersion = ver;
            const ids = new Set(['ALL']);
            state.taxonomy.forEach(g => { ids.add(g.id); g.children.forEach(c => ids.add(c.id)); });
            if (!ids.has(state.activeCategory)) state.activeCategory = 'ALL';
            persistState();
            renderAll();
        }

        async function checkRemoteUpdate() {
            const remote = await fetchRemote();
            if (!remote) return;
            const rHash = dataHash(remote.taxonomy, remote.bookmarks);
            const rVer = 'r-' + rHash;
            const lHash = dataHash(state.taxonomy, state.bookmarks);

            if (rHash === lHash) {                       // 內容一樣，不用問
                if (seedVersionInUse !== rVer) { seedVersionInUse = rVer; ackVersion = rVer; persistState(); }
                return;
            }
            if (freshSeed) { applyRemote(remote, rVer); return; }   // 第一次使用：直接用網站上的最新版
            if (rVer === ackVersion) return;             // 這一版你已經處理過（選過保留），不再打擾

            const useNew = confirm(
                '網站上有新版書籤（' + remote.bookmarks.length + ' 筆），和這個瀏覽器目前的（' + state.bookmarks.length + ' 筆）不同。\n\n' +
                '按「確定」：換成網站上的新版（會取代這個瀏覽器目前的資料）\n' +
                '按「取消」：保留目前的資料（這一版之後不再詢問，想換可按右上角「同步最新」）');
            if (useNew) applyRemote(remote, rVer);
            else { seedVersionInUse = rVer; ackVersion = rVer; persistState(); }
        }

        async function syncNow() {
            const remote = await fetchRemote();
            if (!remote) {
                alert('讀不到網站上的 bookmarks.json。\n\n可能原因：\n・這個頁面是用「檔案」方式開啟（不是 GitHub 網址）\n・目前沒有網路\n・bookmarks.json 還沒上傳到網頁的同一個資料夾');
                return;
            }
            const rHash = dataHash(remote.taxonomy, remote.bookmarks);
            if (rHash === dataHash(state.taxonomy, state.bookmarks)) {
                alert('目前已經是最新版（' + state.bookmarks.length + ' 筆）。');
                return;
            }
            if (confirm('網站上的書籤有 ' + remote.bookmarks.length + ' 筆，這個瀏覽器目前有 ' + state.bookmarks.length + ' 筆。\n\n要換成網站上的版本嗎？（會取代目前的資料）')) {
                applyRemote(remote, 'r-' + rHash);
            }
        }

        function localStorageWorks() {
            try {
                localStorage.setItem('bm_test', '1');
                localStorage.removeItem('bm_test');
                return true;
            } catch (e) { return false; }
        }

        let seedVersionInUse = '';

        function persistState() {
            const savedAt = Date.now();
            let lsOk = false;
            try {
                localStorage.setItem(LS_KEYS.taxonomy, JSON.stringify(state.taxonomy));
                localStorage.setItem(LS_KEYS.bookmarks, JSON.stringify(state.bookmarks));
                localStorage.setItem(LS_KEYS.time, String(savedAt));
                localStorage.setItem('bm_seed_version', seedVersionInUse);
                lsOk = true;
            } catch (e) { console.warn('localStorage 儲存失敗', e); }

            const snapshot = JSON.parse(JSON.stringify({
                taxonomy: state.taxonomy, bookmarks: state.bookmarks, savedAt, seedVersion: seedVersionInUse
            }));
            idbSet('state', snapshot)
                .then(() => showSaveStatus(true))
                .catch(e => {
                    console.warn('IndexedDB 儲存失敗', e);
                    showSaveStatus(lsOk, String(e));
                });
            if (lsOk) showSaveStatus(true);
        }

        function saveState() {
            persistState();
            renderAll();
        }

        function renderAll() {
            renderTree();
            renderBookmarks();
            updateStats();
        }

        function resetToDefaultTaxonomy() {
            if (confirm('確定要還原成預設分類嗎？（您的書籤網址將完整保留）')) {
                state.taxonomy = JSON.parse(JSON.stringify(DEFAULT_TAXONOMY));
                saveState();
            }
        }

        function getCategoryCount(catId) {
            if (catId === 'ALL') return state.bookmarks.length;
            const group = state.taxonomy.find(g => g.id === catId);
            if (group) {
                const childIds = group.children.map(c => c.id);
                return state.bookmarks.filter(b => childIds.includes(b.categoryId)).length;
            }
            return state.bookmarks.filter(b => b.categoryId === catId).length;
        }

                                     ondragleave="removeDropStyle(event)"

                                            <span>${escapeHtml(sub.name)}</span>
                                        </span>
                                        <span class="text-[10px] ${subCount > 0 ? 'bg-indigo-100 text-indigo-600 font-semibold' : 'text-slate-300'} px-1.5 py-0.2 rounded-full">${subCount}</span>

                                    <div class="opacity-0 group-hover/s:opacity-100 flex items-center gap-1 transition">

        function editCategoryName(catId) {
            for (let g of state.taxonomy) {
                if (g.id === catId) {
                    const newName = prompt('請修改主分類名稱：', g.name);
                    if (newName && newName.trim() !== '') {
                        g.name = newName.trim();
                        saveState();
                    }
                    return;
                }
                for (let c of g.children) {
                    if (c.id === catId) {
                        const newName = prompt('請修改細分類名稱：', c.name);
                        if (newName && newName.trim() !== '') {
                            c.name = newName.trim();
                            saveState();
                        }
                        return;
                    }
                }
            }
        }

        function selectCategory(catId) {
            state.activeCategory = catId;
            renderTree();
            renderBookmarks();

            let title = "全部網址書籤";
            if (catId !== 'ALL') {
                state.taxonomy.forEach(g => {
                    if (g.id === catId) title = g.name;
                    g.children.forEach(c => {
                        if (c.id === catId) title = `${g.name} > ${c.name}`;
                    });
                });
            }
            document.getElementById('currentCategoryTitle').innerText = title;
            closeDrawer();
        }

        function openDrawer() {
            document.getElementById('sidebar').classList.add('drawer-open');
            document.getElementById('drawerBackdrop').classList.remove('hidden');
        }
        function closeDrawer() {
            document.getElementById('sidebar').classList.remove('drawer-open');
            document.getElementById('drawerBackdrop').classList.add('hidden');
        }
        function toggleDrawer() {
            if (document.getElementById('sidebar').classList.contains('drawer-open')) closeDrawer(); else openDrawer();
        }

        function renderBookmarks() {
            const grid = document.getElementById('bookmarkGrid');
            const search = document.getElementById('searchInput').value.toLowerCase().trim();

            let list = state.bookmarks;

            if (state.activeCategory !== 'ALL') {
                const group = state.taxonomy.find(g => g.id === state.activeCategory);
                if (group) {
                    const childIds = group.children.map(c => c.id);
                    list = list.filter(b => childIds.includes(b.categoryId));
                } else {
                    list = list.filter(b => b.categoryId === state.activeCategory);
                }
            }

            if (search) {
                list = list.filter(b => b.title.toLowerCase().includes(search) || b.url.toLowerCase().includes(search));
            }

            if (list.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-400">
                        <i class="fa-regular fa-folder-open text-4xl mb-2"></i>
                        <p class="text-sm font-medium">此分類下尚無網址書籤</p>
                    </div>
                `;
                return;
            }

            const canDrag = window.matchMedia && window.matchMedia('(hover: hover)').matches;
            const subIds = new Set();
            const optionsHtml = state.taxonomy.map(g => {
                g.children.forEach(c => subIds.add(c.id));
                return `<optgroup label="${escapeHtml(g.name)}">` +
                    g.children.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('') +
                    `</optgroup>`;
            }).join('');

            grid.innerHTML = list.map(b => {
                let opts = optionsHtml;
                if (subIds.has(b.categoryId)) {
                    opts = opts.replace(`value="${b.categoryId}"`, `value="${b.categoryId}" selected`);
                } else {
                    opts = `<option value="${b.categoryId}" selected>${escapeHtml(getCategoryName(b.categoryId))}</option>` + opts;
                }
                return `
                <div class="bg-white border border-slate-200 hover:border-indigo-300 rounded-xl p-3.5 shadow-2xs hover:shadow-md transition flex flex-col justify-between group ${canDrag ? 'cursor-grab active:cursor-grabbing' : ''}"
                     ${canDrag ? 'draggable="true"' : ''}
                     ondragstart="handleDragStart(event, '${b.id}')">
                    <div>
                        <div class="flex items-start justify-between gap-2 mb-1.5">
                            <a href="${b.url}" target="_blank" class="font-bold text-sm text-slate-800 hover:text-indigo-600 line-clamp-1 flex-1">
                                <i class="fa-solid fa-link text-xs text-indigo-500 mr-1"></i>
                                ${escapeHtml(b.title || b.url)}
                            </a>
                            <button onclick="deleteBookmark('${b.id}')" class="card-del text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition text-xs p-1" aria-label="刪除書籤">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                        <p class="text-xs text-slate-400 truncate mb-2">${escapeHtml(b.url)}</p>
                    </div>
                    <div class="flex items-center justify-between text-[11px] text-slate-400 border-t border-slate-100 pt-2 mt-1">
                        <select onchange="moveBookmark('${b.id}', this.value)" class="bg-slate-100 text-slate-600 px-1.5 py-1 rounded text-[11px] max-w-[70%] truncate border-0 cursor-pointer" aria-label="更換分類">${opts}</select>
                        <span class="drag-hint">可拖曳歸類</span>
                    </div>
                </div>
            `;
            }).join('');
        }

        function handleDragStart(e, bookmarkId) {
            e.dataTransfer.setData('text/plain', bookmarkId);
        }

        function allowDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over-category');
        }

        function removeDropStyle(e) {
            e.currentTarget.classList.remove('drag-over-category');
        }

        function handleDrop(e, targetCategoryId) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over-category');
            const bookmarkId = e.dataTransfer.getData('text/plain');

            const bookmark = state.bookmarks.find(b => b.id === bookmarkId);
            if (bookmark) {
                const group = state.taxonomy.find(g => g.id === targetCategoryId);
                if (group && group.children.length > 0) {
                    bookmark.categoryId = group.children[0].id;
                } else {
                    bookmark.categoryId = targetCategoryId;
                }
                saveState();
            }
        }

        function getCategoryName(catId) {
            for (let g of state.taxonomy) {
                if (g.id === catId) return g.name;
                for (let c of g.children) {
                    if (c.id === catId) return c.name;
                }
            }
            return '未分類';
        }

        function addMainCategory() {
            const name = prompt('請輸入新主分類名稱：');
            if (name) {
                state.taxonomy.push({
                    id: 'group-' + Date.now(),
                    name: name,
                    children: [{ id: 'sub-' + Date.now(), name: '未分類書籤' }]
                });
                saveState();
            }
        }

        function addSubCategory(groupId) {
            const name = prompt('請輸入新細分類名稱：');
            if (name) {
                const group = state.taxonomy.find(g => g.id === groupId);
                if (group) {
                    group.children.push({ id: 'sub-' + Date.now(), name: name });
                    saveState();
                }
            }
        }

        function deleteCategory(catId) {
            if (confirm('確定要刪除此分類嗎？')) {
                state.taxonomy = state.taxonomy.filter(g => {
                    if (g.id === catId) return false;
                    g.children = g.children.filter(c => c.id !== catId);
                    return true;
                });
                saveState();
            }
        }

        function moveGroup(index, direction) {
            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < state.taxonomy.length) {
                const temp = state.taxonomy[index];
                state.taxonomy[index] = state.taxonomy[newIndex];
                state.taxonomy[newIndex] = temp;
                saveState();
            }
        }

        function moveSubCategory(groupId, index, direction) {
            const group = state.taxonomy.find(g => g.id === groupId);
            if (group) {
                const newIndex = index + direction;
                if (newIndex >= 0 && newIndex < group.children.length) {
                    const temp = group.children[index];
                    group.children[index] = group.children[newIndex];
                    group.children[newIndex] = temp;
                    saveState();
                }
            }
        }

        function deleteBookmark(id) {
            const target = state.bookmarks.find(b => b.id === id);
            if (!target) return;
            if (!confirm('要刪除這筆書籤嗎？\n\n' + (target.title || target.url))) return;
            state.bookmarks = state.bookmarks.filter(b => b.id !== id);
            saveState();
        }

        // 用下拉選單換分類（手機 / iPad 不能拖曳，電腦也可以用）
        function moveBookmark(id, catId) {
            const target = state.bookmarks.find(b => b.id === id);
            if (!target || !catId) return;
            target.categoryId = catId;
            saveState();
        }

        function processPastedText() {
            const content = document.getElementById('importTextarea').value.trim();
            if (!content) return alert('請先貼上內容！');

            if (content.startsWith('{') || content.startsWith('[')) {
                try {
                    const data = JSON.parse(content);
                    if (data.taxonomy && data.bookmarks) {
                        state.taxonomy = data.taxonomy;
                        state.bookmarks = data.bookmarks;
                    } else if (Array.isArray(data)) {
                        state.bookmarks = state.bookmarks.concat(data);
                    }
                    saveState();
                    closeImportModal();
                    alert('JSON 備份資料已順利還原！');
                    return;
                } catch(e) {
                    alert('JSON 解析失敗，請確認格式正確！');
                    return;
                }
            }

            const lines = content.split('\n');
            let addedCount = 0;
            lines.forEach(line => {
                const urlMatch = line.match(/https?:\/\/[^\s]+/);
                if (urlMatch) {
                    const url = urlMatch[0];
                    state.bookmarks.push({
                        id: 'bm-' + Date.now() + Math.random().toString(36).substr(2, 4),
                        title: url,
                        url: url,
                        categoryId: state.taxonomy[0].children[0].id
                    });
                    addedCount++;
                }
            });

            saveState();
            closeImportModal();
            alert(`順利解析並新增 ${addedCount} 筆網址！`);
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const content = event.target.result;

                if (file.name.endsWith('.json')) {
                    try {
                        const data = JSON.parse(content);
                        if (data.taxonomy) state.taxonomy = data.taxonomy;
                        if (data.bookmarks) state.bookmarks = data.bookmarks;
                        saveState();
                        closeImportModal();
                        alert('JSON 備份資料載入成功！');
                    } catch(err) {
                        alert('無法讀取 JSON 檔案內容！');
                    }
                } else {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(content, 'text/html');
                    const links = doc.querySelectorAll('a');
                    let count = 0;

                    links.forEach(a => {
                        const href = a.getAttribute('href');
                        const title = a.textContent.trim() || href;
                        if (href && href.startsWith('http')) {
                            state.bookmarks.push({
                                id: 'bm-' + Date.now() + Math.random().toString(36).substr(2, 4),
                                title: title,
                                url: href,
                                categoryId: state.taxonomy[0].children[0].id
                            });
                            count++;
                        }
                    });

                    saveState();
                    closeImportModal();
                    alert(`成功匯入 ${count} 筆 HTML 書籤！`);
                }
            };
            reader.readAsText(file);
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `bookmarks_backup_${Date.now()}.json`);
            dlAnchorElem.click();
        }

        function exportHTML() {
            let html = `<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>Bookmarks</TITLE>\n<H1>Bookmarks</H1>\n<DL><p>\n`;

            state.taxonomy.forEach(group => {
                html += `<DT><H3>${escapeHtml(group.name)}</H3>\n<DL><p>\n`;
                group.children.forEach(sub => {
                    const bms = state.bookmarks.filter(b => b.categoryId === sub.id);
                    if (bms.length > 0) {
                        html += `<DT><H3>${escapeHtml(sub.name)}</H3>\n<DL><p>\n`;
                        bms.forEach(b => {
                            html += `<DT><A HREF="${escapeHtml(b.url)}">${escapeHtml(b.title)}</A>\n`;
                        });
                        html += `</DL><p>\n`;
                    }
                });
                html += `</DL><p>\n`;
            });

            html += `</DL><p>\n`;

            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `bookmarks_${Date.now()}.html`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function openImportModal() {
            document.getElementById('importModal').classList.remove('hidden');
        }

        function closeImportModal() {
            document.getElementById('importModal').classList.add('hidden');
            document.getElementById('importTextarea').value = '';
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = state.bookmarks.length;
            let subCount = 0;
            state.taxonomy.forEach(g => subCount += g.children.length);
            document.getElementById('stat-cats').innerText = subCount;
        }

        function openAddBookmarkModal() {
            const url = prompt('請輸入網址 (URL)：');
            if (url) {
                const title = prompt('請輸入標題名稱：') || url;
                state.bookmarks.push({
                    id: 'bm-' + Date.now(),
                    title: title,
                    url: url,
                    categoryId: state.activeCategory === 'ALL' ? state.taxonomy[0].children[0].id : state.activeCategory
                });
                saveState();
            }
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
